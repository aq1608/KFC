# Fly.io deployment config for KFC.
#
# IMPORTANT: KFC stores everything in a single-file SQLite database on the
# mounted volume, so it must run as exactly ONE instance. Do not
# `fly scale count` above 1 (each machine would get its own volume + DB).

app = "kfc-ctf"            # change to your own globally-unique app name
primary_region = "iad"     # pick a region close to your players

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  KFC_DATA_DIR = "/app/data"   # SQLite + session DBs live on the volume

# Persistent volume for the SQLite databases (survives deploys/restarts).
[[mounts]]
  source = "kfc_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep a single machine always running (safe for the file-based DB).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Fly marks the machine healthy once /healthz returns 2xx.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
