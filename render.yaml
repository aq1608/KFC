# Render Blueprint for KFC on the FREE tier (https://render.com/docs/blueprint-spec).
#
# Free web services have an EPHEMERAL filesystem and sleep after ~15 min idle,
# so this uses the Postgres backend (no local disk needed). It provisions a free
# Render Postgres and wires DATABASE_URL to it automatically.
#
# Prefer SQLite + persistent storage instead? Switch the service to
# `plan: starter`, add a `disk:` mounted at /app/data with KFC_DATA_DIR=/app/data,
# and remove the `databases:` block + the DATABASE_URL env var.

databases:
  - name: kfc-db
    plan: free
    databaseName: kfc
    user: kfc

services:
  - type: web
    name: kfc
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free               # free web service (sleeps when idle)
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL    # use Postgres (works on the disk-less free tier)
        fromDatabase:
          name: kfc-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true  # Render generates a strong random value
      - key: TOT_SECRET
        generateValue: true
      - key: ADMIN_USERS
        sync: false          # set your admin usernames in the dashboard
